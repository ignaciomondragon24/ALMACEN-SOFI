# Railway deployment config - Compatible con Railpack

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py setup_initial_data && gunicorn superrecord.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 2 --worker-class gthread --timeout 120 --log-file - --access-logfile - --error-logfile -"
healthcheckPath = "/accounts/login/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
