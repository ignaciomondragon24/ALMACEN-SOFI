# Este archivo es legacy (Nixpacks). Railway ahora usa Railpack.
# Ver railway.toml para la configuracion de deploy.
# No borrar - puede ser necesario si se cambia el builder.
[phases.setup]
nixPkgs = ["zlib", "libjpeg", "libpng", "freetype", "cairo", "pkg-config"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install --no-cache-dir -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate --noinput && python manage.py setup_initial_data && gunicorn superrecord.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 2 --worker-class gthread --timeout 120 --log-file -"
